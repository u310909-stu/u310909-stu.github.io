<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 智慧監控面板</title>
    <!-- 引入 MQTT.js 庫 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>

    <style>
        :root {
            --primary: #00d1b2;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --warn: #ff4757;
        }

        body {
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 30px;
            font-weight: 300;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
            margin-top: 20px;
        }

        .box {
            background: var(--card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .box:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .label { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
        .value { font-size: 38px; color: var(--primary); font-weight: bold; }
        .unit { font-size: 16px; color: #64748b; margin-left: 4px; }

        #status {
            margin-top: auto;
            margin-bottom: 20px;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50px;
            font-size: 13px;
        }

        /* 數值更新時的閃爍效果 */
        .updating { animation: pulse 0.4s ease; }
        @keyframes pulse {
            0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; }
        }

        /* 警報樣式 */
        .alarm { background: rgba(255, 71, 87, 0.2) !important; border-color: var(--warn) !important; }
        .alarm .value { color: var(--warn); }
    </style>
</head>
<body>

    <h1>ESP32 數據監控中心</h1>

    <div class="dashboard">
        <div class="box" id="card-temp">
            <div class="label">環境溫度</div>
            <span id="temp" class="value">--</span><span class="unit">°C</span>
        </div>
        <div class="box" id="card-humi">
            <div class="label">環境濕度</div>
            <span id="humi" class="value">--</span><span class="unit">%</span>
        </div>
        <div class="box" id="card-lux">
            <div class="label">光照強度</div>
            <span id="lux" class="value">--</span><span class="unit">lx</span>
        </div>
        <div class="box" id="card-w_temp">
            <div class="label">水溫計</div>
            <span id="w_temp" class="value">--</span><span class="unit">°C</span>
        </div>
        <div class="box" id="card-w_level">
            <div class="label">水位計</div>
            <span id="w_level" class="value">--</span><span class="unit">%</span>
        </div>
    </div>

    <div id="status">正在初始化連線...</div>

    <script>
        const brokerUrl = "wss://broker.emqx.io:8084/mqtt";
        const client = mqtt.connect(brokerUrl);


        // 通用更新函式
        function updateDisplay(id, val, alarmTrigger = null) {
            const el = document.getElementById(id);
            const card = document.getElementById('card-' + id);
            if(!el) return;

            el.innerText = val;
            el.classList.add('updating');
            setTimeout(() => el.classList.remove('updating'), 400);

            // 警報邏輯 (可視需求調整)
            if(alarmTrigger) {
                card.classList.toggle('alarm', alarmTrigger(parseFloat(val)));
            }
        }

        client.on("connect", function () {
            // document.getElementById("status").innerHTML = "● <span style='color:#00d1b2'>已連線到 Broker</span>";
            document.getElementById("status").innerText = "✅ 已連線 (使用 MQTT.js)";
            document.getElementById("status").style.color = "#00d1b2";
            
            // 這裡的主題名稱必須與 ESP32 程式碼定義的一模一樣
            client.subscribe("MYproject3109915/temperature");
            client.subscribe("MYproject3109915/humidity");
            client.subscribe("MYproject3109915/light");      // 對應 light_topic
            client.subscribe("MYproject3109915/watertemp");   // 對應 watertemp_topic
            client.subscribe("MYproject3109915/waterleval");  // 對應 waterleval_topic
        });

        client.on("message", function (topic, message) {
            const payload = message.toString();
            console.log("收到數據:", topic, payload);

            if (topic.includes("temperature")) updateDisplay("temp", payload, v => v > 35);
            else if (topic.includes("humidity")) updateDisplay("humi", payload);
            else if (topic.includes("light")) updateDisplay("lux", payload);
            else if (topic.includes("watertemp")) updateDisplay("w_temp", payload, v => v > 30);
            else if (topic.includes("waterleval")) updateDisplay("w_level", payload, v => v < 20);
            
            document.getElementById("status").innerText = "● 最後更新: " + new Date().toLocaleTimeString();
        });

        client.on("error", (err) => {
            document.getElementById("status").innerHTML = "❌ <span style='color:red'>連線失敗</span>";
        });
    </script>
</body>
</html>
